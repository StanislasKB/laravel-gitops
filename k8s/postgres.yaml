apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: laravel
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: laravel
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{ containerPort: 5432 }]
        env:
        - name: POSTGRES_DB
          valueFrom: { configMapKeyRef: { name: laravel-config, key: DB_DATABASE } }
        - name: POSTGRES_USER
          valueFrom: { secretKeyRef: { name: laravel-secret, key: DB_USERNAME } }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: laravel-secret, key: DB_PASSWORD } }
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: postgres-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: laravel
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]